name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Test (macOS)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            # Tests run only on macOS. Some tests download models from
            # Hugging Face Hub, which requires URLSession. On Linux,
            # FoundationNetworking crashes during URLSession teardown.
            # See: https://github.com/swiftlang/swift-corelibs-foundation/issues/3675
            - name: Run tests
              run: swift test

    test-rust:
        name: Test Rust Backend (macOS)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Read Rust toolchain version
              id: rust-toolchain
              run: |
                  version=$(awk -F'"' '/^channel/ {print $2; exit}' rust-toolchain.toml)
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: ${{ steps.rust-toolchain.outputs.version }}
                  targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

            - name: Build Rust XCFramework
              run: bash scripts/rust/build/build-rust-xcframework.sh

            - name: Run Rust trait tests
              env:
                  TOKENIZERS_RUST_LOCAL_XCFRAMEWORK_PATH: Binaries/TokenizersRust.xcframework
              run: |
                  swift package clean
                  swift test --traits Rust

    build-linux:
        name: Build (Linux)
        runs-on: ubuntu-latest
        container: swift:6.2.3
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Build
              run: swift build

            - name: Build tests
              run: swift build --build-tests

    docs:
        name: Documentation
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Verify documentation
              run: bash scripts/verify-docs.sh

    lint:
        name: Lint
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - run: swift format lint --strict --recursive .

            - name: Suggest fixes (if check fails)
              if: failure()
              run: |
                  echo "### Here's how to fix the formatting locally:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo '```bash' >> $GITHUB_STEP_SUMMARY
                  echo "# Format all Swift files" >> $GITHUB_STEP_SUMMARY
                  echo 'swift format -i --recursive .' >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY

    rust-pin-guard:
        name: Rust pin guard
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Check Rust source hash against rust/Pin.json
              run: bash scripts/rust/release/check-pin.sh

            - name: Check for pre-release pin on main
              if: |
                  (github.event_name == 'pull_request' && github.base_ref == 'main')
                  || (github.event_name == 'push' && github.ref == 'refs/heads/main')
              env:
                  ALLOW_PRERELEASE_PIN: ${{ vars.ALLOW_PRERELEASE_PIN }}
              run: bash scripts/rust/release/check-prerelease-pin.sh
