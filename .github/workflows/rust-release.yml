name: Publish Rust XCFramework

run-name: Rust XCFramework ${{ inputs.version }} @ ${{ github.sha }}

on:
    workflow_dispatch:
        inputs:
            version:
                description: Semantic artifact version, for example 0.2.2 or 0.2.2-rc.1
                required: true
                type: string
            expected_commit:
                description: Full commit SHA the dispatcher expects to run against. Must match GITHUB_SHA.
                required: true
                type: string

permissions:
    contents: read

jobs:
    build-validate:
        name: Build and validate Rust XCFramework
        runs-on: macos-latest
        steps:
            - name: Verify expected commit
              env:
                  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
              run: |
                  set -euo pipefail

                  if [[ -z "$EXPECTED_COMMIT" ]]; then
                      echo "expected_commit input is required." >&2
                      exit 1
                  fi

                  if [[ "$GITHUB_SHA" != "$EXPECTED_COMMIT" ]]; then
                      echo "Dispatched commit mismatch:" >&2
                      echo "  expected_commit: $EXPECTED_COMMIT" >&2
                      echo "  GITHUB_SHA:      $GITHUB_SHA" >&2
                      exit 1
                  fi

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Read Rust toolchain version
              id: rust-toolchain
              run: |
                  version=$(awk -F'"' '/^channel/ {print $2; exit}' rust-toolchain.toml)
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: ${{ steps.rust-toolchain.outputs.version }}
                  targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

            - name: Package release artifact
              run: bash scripts/rust/build/package-rust-release.sh "${{ inputs.version }}"

            - name: Validate local Rust artifact
              env:
                  TOKENIZERS_RUST_LOCAL_XCFRAMEWORK_PATH: Binaries/TokenizersRust.xcframework
              run: |
                  set -euo pipefail

                  swift package clean
                  swift test --traits Rust

            - name: Compute source hash
              id: source-hash
              run: |
                  hash=$(bash scripts/rust/hash-source.sh)
                  echo "hash=$hash" >> "$GITHUB_OUTPUT"

            - name: Build release manifest
              env:
                  VERSION: ${{ inputs.version }}
                  SOURCE_HASH: ${{ steps.source-hash.outputs.hash }}
                  RUST_TOOLCHAIN: ${{ steps.rust-toolchain.outputs.version }}
                  GIT_COMMIT: ${{ github.sha }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  archive="Artifacts/TokenizersRust-${VERSION}.xcframework.zip"
                  checksum_file="${archive}.checksum"
                  manifest="Artifacts/TokenizersRust-${VERSION}.manifest.json"

                  if [[ ! -f "$archive" || ! -f "$checksum_file" ]]; then
                      echo "Expected $archive and $checksum_file to exist after packaging." >&2
                      exit 1
                  fi

                  checksum=$(awk '{print $1}' "$checksum_file")
                  xcframework_url="https://github.com/${REPO}/releases/download/tokenizers-rust-${VERSION}/TokenizersRust-${VERSION}.xcframework.zip"

                  CHECKSUM="$checksum" XCFRAMEWORK_URL="$xcframework_url" python3 <<'PY' > "$manifest"
                  import json
                  import os

                  print(
                      json.dumps(
                          {
                              "hash_schema_version": 1,
                              "version": os.environ["VERSION"],
                              "git_commit": os.environ["GIT_COMMIT"],
                              "rust_toolchain": os.environ["RUST_TOOLCHAIN"],
                              "source_hash_sha256": os.environ["SOURCE_HASH"],
                              "xcframework_url": os.environ["XCFRAMEWORK_URL"],
                              "checksum": os.environ["CHECKSUM"],
                          },
                          indent=2,
                      )
                  )
                  PY

            - name: Generate release notes
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail

                  python3 scripts/rust/release/rust-release-notes.py \
                      --repo-root . \
                      --target-ref "$GITHUB_SHA" \
                      --version "${VERSION}" \
                      --output "Artifacts/TokenizersRust-${VERSION}.release-notes.md"

            - name: Upload release artifacts
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: TokenizersRust-${{ inputs.version }}
                  path: |
                      Artifacts/TokenizersRust-${{ inputs.version }}.xcframework.zip
                      Artifacts/TokenizersRust-${{ inputs.version }}.xcframework.zip.checksum
                      Artifacts/TokenizersRust-${{ inputs.version }}.manifest.json
                      Artifacts/TokenizersRust-${{ inputs.version }}.release-notes.md
                  if-no-files-found: error

    publish:
        name: Publish release assets
        needs: build-validate
        runs-on: macos-latest
        environment: rust-release
        permissions:
            contents: write
        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
              with:
                  name: TokenizersRust-${{ inputs.version }}
                  path: Artifacts

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail

                  if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Version must be semantic, for example 0.2.2 or 0.2.2-rc.1." >&2
                      exit 1
                  fi

                  tag="tokenizers-rust-${VERSION}"
                  title="Tokenizers Rust XCFramework ${VERSION}"
                  archive="Artifacts/TokenizersRust-${VERSION}.xcframework.zip"
                  checksum="${archive}.checksum"
                  manifest="Artifacts/TokenizersRust-${VERSION}.manifest.json"
                  notes_file="Artifacts/TokenizersRust-${VERSION}.release-notes.md"

                  if gh release view "${tag}" >/dev/null 2>&1; then
                      echo "Release ${tag} already exists. Publish a new semantic version instead of mutating an existing artifact." >&2
                      exit 1
                  fi

                  prerelease_flag=()
                  if [[ "${VERSION}" == *-* ]]; then
                      prerelease_flag=(--prerelease)
                  fi

                  gh release create "${tag}" "${archive}" "${checksum}" "${manifest}" \
                      --target "$GITHUB_SHA" \
                      --title "${title}" \
                      --notes-file "${notes_file}" \
                      "${prerelease_flag[@]}"

                  release_url="$(gh release view "${tag}" --json url --jq '.url')"
                  {
                      echo "### Published release"
                      echo
                      echo "- ${release_url}"
                  } >> "$GITHUB_STEP_SUMMARY"
