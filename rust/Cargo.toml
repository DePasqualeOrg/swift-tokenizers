[package]
name = "tokenizers_rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "tokenizers_rust"
crate-type = ["staticlib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["uniffi-cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
minijinja = { version = "2.24.0", default-features = false, features = ["adjacent_loop_items", "builtins", "deserialization", "json", "loop_controls", "macros", "multi_template", "serde", "std_collections"] }
minijinja-contrib = { version = "2.24.0", default-features = false, features = ["pycompat"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Held at 0.22: tokenizers 0.23.1 regressed `decode(skip_special_tokens=true)`
# for added tokens declared with both `special: true` and `normalized: true`
# (e.g. Llama-2's `<s>`), which are no longer skipped and leak into decoded
# text. Reproduced against 0.22.2/0.23.1 with a standalone program; the
# Llama-2 edge cases in Tests/TokenizersTests pin the correct behavior.
# TODO: bump once a tokenizers release restores skipping for
# normalized special tokens.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
uniffi = { version = "0.32", default-features = false }

[features]
# Enables the `uniffi-bindgen-swift` binary entry point. Activates `cargo-metadata`
# so the bindgen auto-discovers `rust/uniffi.toml` from the crate root.
uniffi-cli = ["uniffi/cli", "uniffi/cargo-metadata"]

# Matches the Python `tokenizers` wheel. `unwind` lets UniFFI surface Rust
# panics as thrown Swift errors instead of aborting the host app; unstripped
# keeps symbol names for crash reports. Costs ~770 KB in the linked consumer
# binary (aarch64-apple-darwin).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "none"

# UniFFI needs one Swift bindgen fix here: allow this generated wrapper to hide
# the lower-level Rust FFI module plus converter helpers from public Swift
# interfaces. Shared with swift-hf-api; the visibility options live in
# `rust/uniffi.toml`.
#
# This revision must stay identical to swift-hf-api's: both packages patch the
# same uniffi crates, and a mismatch means the two artifactbundles are built
# against different bindgen behavior.
# TODO: drop this entire `[patch.crates-io]` block and use plain `uniffi` once
# the visibility options are included in a uniffi-rs release.
[patch.crates-io]
uniffi = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_bindgen = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_core = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_macros = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_meta = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_pipeline = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_udl = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_internal_macros = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
